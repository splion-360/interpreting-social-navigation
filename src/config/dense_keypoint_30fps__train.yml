model: flat
data_path: data/mabe/raw/mouse_triplet_train.npy
epochs: 50
batch_size: 8
window_length: 20
observation_length: 8
prediction_length: 12
graph_variant: dense_keypoint
stride: 20
frame_step: 1
source_fps: 30.0
max_train_windows: 800
max_validation_windows: 200
validation_fraction: 0.2
motion_sampling: true
motion_score: mean_keypoint_speed_px_s
motion_group_mix:
  low: 0.2
  medium: 0.4
  high: 0.4
learning_rate: 0.001
grad_clip: 10.0
seed: 42
device: cuda
wandb: false
wandb_project: interpreting-social-navigation
wandb_run_name: dense-keypoint-baseline
checkpoint_dir: checkpoints/dense_keypoint
save_checkpoints: true
checkpoint_frequency: 20
wandb_artifact_name: dense-keypoint-best-checkpoint
resume_checkpoint: null
resume_wandb_artifact: null
resume_download_dir: checkpoints/wandb
