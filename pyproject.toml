[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interpreting-social-navigation"
version = "0.1.0"
description = "Trajectory forecasting and representation learning for MABe mouse triplets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "torch==2.5.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
wandb = [
    "wandb>=0.29.0",
]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
    "matplotlib>=3.8",
    "mypy>=1.18.0",
    "pyright>=1.1.390",
    "pytest>=8",
    "ruff>=0.5",
    "seaborn>=0.13",
    "wandb>=0.29.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
only-include = [
    "src/config",
    "src/data",
    "src/loss.py",
    "src/models",
    "src/st_graph.py",
    "src/train.py",
]
sources = ["src"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
exclude = [
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    "__pycache__",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    "*.venv",
    ".cursor",
    ".githooks",
    ".venv",
    ".vscode",
    "build",
    "data",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
known-first-party = ["config", "data", "loss", "models", "st_graph", "train"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-third-party = [
    "matplotlib",
    "numpy",
    "pytest",
    "yaml",
    "scipy",
    "torch",
    "tqdm",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80
skip-magic-trailing-comma = false
