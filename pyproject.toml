[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interpreting-social-navigation"
version = "0.1.0"
description = "Trajectory forecasting and representation learning for MABe mouse social navigation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
    "seaborn",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "wandb",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
